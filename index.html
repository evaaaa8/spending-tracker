<!DOCTYPE html>
<html>
    <head>
        <title> My Spending Tracker </title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>

    <body>
        <h1 style="text-align: center;">Spending Tracker</h1>

        <h2 style="text-align: center;">Yearly Statistics</h2>
        
        <div class="charts-container">
            <canvas id="lineChart"></canvas>
            <canvas id="pieChart"></canvas>
        </div>"



        <div class="page-container">
            <div class="left-column"> 
                <div>
                    <button onclick="showForm('expense')">Add Expense</button>
                    <button onclick="showForm('income')">Add Income</button>
                </div>

                <form id="entryForm" style="display: none;">
                    <input type="date" id="date" required>
                    <input type="text" id="amount" placeholder="Amount (e.g. 12.50)" oninput="restrictAmount(this)" required>
                    <div id="amountError" style="color: red; display: none;">Enter a valid number with up to 2 decimal places (e.g. 10, 10.5, or 10.50)</div>
                    <input type="text" id="description" placeholder="What was it for?" required>
                    <select id="category">
                        <option value="food">Food</option>
                        <option value="shopping">Shopping</option>
                        <option value="school">School</option>
                        <option value="rent">Rent</option>
                        <option value="other">Other</option>
                    </select>
                    <button type="submit">Save</button>
                </form>

                <div id="entryList"></div>
            </div>

            <div class="right-column">
                <!--charts go here later  --> 
            </div>

        </div>

        <script src="script.js"></script>

    </body>
</html>
