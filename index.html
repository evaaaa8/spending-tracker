<!DOCTYPE html>
<html>
    <head>
        <title> My Expense Tracker </title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>

    <body>
<h1 style="text-align: center;">Spending Tracker</h1>

<div class="button-row">
<button onclick="showForm('expense')" class="add-btn">Add Expense</button>
<button onclick="showForm('income')" class="add-btn">Add Income</button>
</div>

<form id="entryForm" style="display: none;">
<input type="date" id="date" required>
<input type="text" id="amount" placeholder="Amount (e.g. 12.50)" oninput="restrictAmount(this)" required>
<div id="amountError" style="color: red; display: none;">Enter a valid number with up to 2 decimal places (e.g. 10, 10.5, or 10.50)</div>
<input type="text" id="description" placeholder="What was it for?" required>
<select id="category"></select>
<button type="submit" class="save-btn">Save</button>
</form>

<h2 style="text-align: center;">Yearly Statistics</h2>
<div class="charts-container">
<canvas id="lineChart"></canvas>
<div class="pie-wrapper">
<canvas id="pieChart"></canvas>
<div id="pieLegend" class="pie-legend"></div>
</div>
</div>

<div class="page-container" id="pageContainer"></div>

<script src="script.js"></script>

</body>
</html>
</html>
