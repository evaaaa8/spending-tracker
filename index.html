<!DOCTYPE html>
<html>
    <head>
        <title> My Spending Tracker </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Spending Tracker</h1>

        <div>
            <button onclick="showForm('expense')">Add Expense</button>
            <button onclick="showForm('income')">Add Income</button>
        </div>

        <form id="entryForm" style="display: none;">
            <input type="date" id="date" required>
            <input type="text" id="amount" placeholder="Amount" required>
            <div id="amountError" style="color: red; display: none;">Enter a valid number with up to 2 decimal places (e.g. 10, 10.5, or 10.50)</div>
            <input type="text" id="description" placeholder="What was it for?" required>
            <select id="category">
                <option value="food">Food</option>
                <option value="shopping">Shopping</option>
                <option value="school">School</option>
                <option value="rent">Rent</option>
                <option value="other">Other</option>
            </select>
            <button type="submit">Save</button>
        </form>

        <h2>
            Monthly Net: <span id="monthlyNet">$0</span>
        </h2>

        <div id="entryList"></div>

        <script src="script.js"></script>

    </body>
</html>
